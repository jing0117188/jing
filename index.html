<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1020">
<title>星光影院</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{--bg:#0d1020;--card:#181d33;--text:#e9edf8;--sub:#8b93ad;--a1:#6c7bff;--a2:#ff6b9d}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);
    min-height:100vh;min-height:100dvh;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  }
  .hidden{display:none!important}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input{font:inherit}

  /* ---------- 登录注册 ---------- */
  .auth{
    min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;
    background:
      radial-gradient(600px 420px at 10% 0%,rgba(108,123,255,.35),transparent 60%),
      radial-gradient(600px 420px at 90% 100%,rgba(255,107,157,.28),transparent 60%),
      var(--bg);
  }
  .auth-card{
    width:100%;max-width:380px;background:rgba(24,29,51,.9);border:1px solid rgba(255,255,255,.08);
    border-radius:22px;padding:26px 22px;backdrop-filter:blur(12px);
    box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  .logo{font-size:21px;font-weight:800;text-align:center;
    background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{text-align:center;color:var(--sub);font-size:12.5px;margin:6px 0 20px}
  .tabs{display:flex;background:rgba(255,255,255,.06);border-radius:12px;padding:4px;margin-bottom:18px}
  .tab{flex:1;padding:10px;border-radius:9px;color:var(--sub);font-size:14.5px;transition:.2s}
  .tab.active{background:linear-gradient(135deg,var(--a1),#8b6cff);color:#fff;font-weight:600}
  .auth input{
    width:100%;padding:13px 14px;margin-bottom:12px;border-radius:12px;font-size:15px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--text);outline:none;
  }
  .auth input:focus{border-color:var(--a1);background:rgba(108,123,255,.12)}
  .auth input::placeholder{color:#5d6584}
  .msg{font-size:12.5px;min-height:18px;color:#ff6b81;margin:0 0 8px}
  .msg.ok{color:#4ade80}
  .primary{
    width:100%;padding:13px;border-radius:12px;font-size:15.5px;font-weight:600;color:#fff;
    background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 10px 22px rgba(108,123,255,.3);
  }
  .primary:active{transform:scale(.98)}
  .guest{
    display:block;width:100%;margin-top:16px;padding:12px;border-radius:12px;font-size:14px;
    color:var(--sub);border:1px dashed rgba(255,255,255,.16);
  }
  .guest:active{background:rgba(255,255,255,.05)}

  /* ---------- 主界面 ---------- */
  header{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));
    background:rgba(13,16,32,.88);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06);
  }
  .brand{font-size:16.5px;font-weight:800;
    background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .who{font-size:12.5px;color:var(--sub);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .page{display:none;padding:14px 14px 96px}
  .page.active{display:block;animation:fade .22s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .sec{font-size:16px;font-weight:700;margin:22px 0 12px;display:flex;align-items:center;gap:8px}
  .sec::before{content:"";width:4px;height:15px;border-radius:3px;
    background:linear-gradient(180deg,var(--a1),var(--a2))}

  .hero{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
  .hero::-webkit-scrollbar{display:none}
  .hero-card{
    flex:0 0 84%;aspect-ratio:16/9;border-radius:16px;position:relative;overflow:hidden;
    scroll-snap-align:start;box-shadow:0 12px 26px rgba(0,0,0,.45);cursor:pointer;
  }
  .hero-card img{width:100%;height:100%;object-fit:cover}
  .hero-card::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.8))}
  .hero-txt{position:absolute;left:14px;right:14px;bottom:12px;z-index:2}
  .hero-txt h2{font-size:17px;margin-bottom:3px}
  .hero-txt p{font-size:12px;color:#c9d1e8}

  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
  .card{cursor:pointer;transition:transform .15s}
  .card:active{transform:scale(.95)}
  .cover{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;
    background:#1a1f38;box-shadow:0 8px 18px rgba(0,0,0,.35)}
  .cover img{width:100%;height:100%;object-fit:cover}
  .badge{position:absolute;right:7px;bottom:7px;width:26px;height:26px;border-radius:50%;
    display:grid;place-items:center;font-size:10px;color:#fff;
    background:rgba(108,123,255,.92);box-shadow:0 4px 10px rgba(0,0,0,.45)}
  .c-title{font-size:12.5px;margin-top:7px;line-height:1.35;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
  .c-sub{font-size:11px;color:var(--sub);margin-top:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

  .bottom-nav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;
    padding:7px 0 calc(7px + env(safe-area-inset-bottom));
    background:rgba(20,25,45,.96);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.07);
  }
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 14px;
    border-radius:12px;color:var(--sub);font-size:10.5px;transition:.2s}
  .nav-item .ico{font-size:18px;line-height:1}
  .nav-item.active{color:var(--a1)}

  .profile{background:var(--card);border-radius:16px;padding:20px;display:flex;align-items:center;gap:15px}
  .avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
    font-size:22px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2))}
  .p-name{font-size:16.5px;font-weight:600}
  .p-desc{font-size:12px;color:var(--sub);margin-top:4px}
  .ghost{width:100%;padding:13px;border-radius:12px;margin-top:16px;
    background:rgba(255,107,129,.14);color:#ff8095;font-size:14.5px;font-weight:600}
  .tip{font-size:12px;color:var(--sub);line-height:1.85;margin-top:18px}

  /* ---------- 弹层 ---------- */
  .modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
    padding:12px;background:rgba(5,7,16,.88);backdrop-filter:blur(6px)}
  .modal.show{display:flex;animation:fade .2s ease}
  .box{width:100%;max-width:800px;background:var(--card);border-radius:18px;overflow:hidden;
    border:1px solid rgba(255,255,255,.08);max-height:92vh;display:flex;flex-direction:column}
  .m-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0}
  .m-head h3{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .close{font-size:24px;line-height:1;color:var(--sub);padding:0 4px}
  .close:active{color:#fff}

  .screen{position:relative;width:100%;aspect-ratio:16/9;background:#000;flex-shrink:0}
  .screen canvas{display:block;width:100%;height:100%}
  .screen video{display:block;width:100%;height:100%;background:#000}

  .m-body{padding:13px 15px 16px;overflow-y:auto}
  .m-body h4{font-size:15.5px;margin-bottom:6px}
  .m-body p{font-size:12.5px;color:var(--sub);line-height:1.7}
  .play-bar{display:flex;align-items:center;gap:10px;margin-top:12px}
  .play-bar button{padding:9px 18px;border-radius:10px;font-size:13.5px;
    background:rgba(255,255,255,.09)}
  .play-bar button:active{background:var(--a1)}
  .play-bar .hint{font-size:11.5px;color:var(--sub)}

  /* 阅读器 */
  .reader{width:100%;max-width:760px;background:#151a2e;border-radius:18px;overflow:hidden;
    border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;
    max-height:92vh;height:92vh}
  .tools{display:flex;align-items:center;gap:6px}
  .tools button{width:34px;height:32px;border-radius:9px;font-size:12.5px;
    background:rgba(255,255,255,.09);color:var(--text)}
  .tools button:active{background:var(--a1)}
  .r-content{padding:18px 20px;overflow-y:auto;flex:1;line-height:1.95;
    font-size:17px;color:#d9e0f0;-webkit-overflow-scrolling:touch}
  .r-content h2{font-size:16.5px;margin-bottom:16px;color:#fff;padding-bottom:11px;
    border-bottom:1px solid rgba(255,255,255,.09)}
  .r-content p{margin-bottom:15px;text-indent:2em}
  .r-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 14px;padding-bottom:calc(11px + env(safe-area-inset-bottom));
    border-top:1px solid rgba(255,255,255,.07);flex-shrink:0}
  .r-nav button{padding:9px 17px;border-radius:10px;font-size:13.5px;background:rgba(255,255,255,.09)}
  .r-nav button:active{background:var(--a1)}
  .r-nav button:disabled{opacity:.3}
  .r-nav span{font-size:12px;color:var(--sub)}

  @media(min-width:760px){
    .hero-card{flex:0 0 46%}
    .grid{grid-template-columns:repeat(auto-fill,minmax(136px,1fr))}
  }
</style>
</head>
<body>

<!-- ============ 登录 / 注册 ============ -->
<div id="authScreen" class="auth">
  <div class="auth-card">
    <div class="logo">✨ 星光影院</div>
    <div class="sub">看片 · 读小说 · 一个页面就够</div>

    <div class="tabs">
      <button class="tab active" data-tab="login">登录</button>
      <button class="tab" data-tab="reg">注册</button>
    </div>

    <form id="loginForm">
      <input id="lu" type="text" placeholder="用户名" autocomplete="username">
      <input id="lp" type="password" placeholder="密码" autocomplete="current-password">
      <div class="msg" id="lm"></div>
      <button type="submit" class="primary">登 录</button>
    </form>

    <form id="regForm" class="hidden">
      <input id="ru" type="text" placeholder="用户名（2-12 位）" autocomplete="username">
      <input id="rp" type="password" placeholder="密码（至少 6 位）" autocomplete="new-password">
      <input id="rp2" type="password" placeholder="确认密码" autocomplete="new-password">
      <div class="msg" id="rm"></div>
      <button type="submit" class="primary">注 册</button>
    </form>

    <button class="guest" id="guestBtn">先随便逛逛 →</button>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div id="app" class="hidden">
  <header>
    <div class="brand">✨ 星光影院</div>
    <div class="who" id="who">游客</div>
  </header>

  <main>
    <section id="page-home" class="page active">
      <div class="hero" id="heroBox"></div>
      <div class="sec">热门影视</div>
      <div class="grid" id="homeMovies"></div>
      <div class="sec">推荐小说</div>
      <div class="grid" id="homeBooks"></div>
    </section>

    <section id="page-movies" class="page">
      <div class="sec">全部影视</div>
      <div class="grid" id="movieGrid"></div>
    </section>

    <section id="page-books" class="page">
      <div class="sec">全部小说</div>
      <div class="grid" id="bookGrid"></div>
    </section>

    <section id="page-me" class="page">
      <div class="sec">我的</div>
      <div class="profile">
        <div class="avatar" id="avatar">游</div>
        <div>
          <div class="p-name" id="meName">游客</div>
          <div class="p-desc" id="meDesc">未登录 · 数据保存在本机</div>
        </div>
      </div>
      <button class="ghost" id="logoutBtn">退出 / 切换账号</button>
      <div class="tip">
        这是纯前端演示页：账号数据只存在你本机浏览器里。<br>
        影视区播放的是真实的测试视频，手机端请手动点击播放键。
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-page="home"><span class="ico">🏠</span>首页</button>
    <button class="nav-item" data-page="movies"><span class="ico">🎬</span>影视</button>
    <button class="nav-item" data-page="books"><span class="ico">📖</span>小说</button>
    <button class="nav-item" data-page="me"><span class="ico">👤</span>我的</button>
  </nav>
</div>

<!-- ============ 播放器 ============ -->
<div id="playerModal" class="modal">
  <div class="box">
    <div class="m-head">
      <h3 id="playerTitle">播放中</h3>
      <button class="close" data-close="player">×</button>
    </div>
    <div class="screen">
      <canvas id="cv"></canvas>
      <video id="videoEl" class="hidden" playsinline controls preload="none"></video>
    </div>
    <div class="m-body">
      <h4 id="playerName"></h4>
      <p id="playerDesc"></p>
      <div class="play-bar">
        <button id="playBtn">⏸ 暂停</button>
        <span class="hint" id="playHint">视频加载中...</span>
      </div>
    </div>
  </div>
</div>

<!-- ============ 阅读器 ============ -->
<div id="readerModal" class="modal">
  <div class="reader">
    <div class="m-head">
      <h3 id="readerTitle">书名</h3>
      <div class="tools">
        <button id="fontMinus">A-</button>
        <button id="fontPlus">A+</button>
        <button class="close" data-close="reader">×</button>
      </div>
    </div>
    <div class="r-content" id="readerContent"></div>
    <div class="r-nav">
      <button id="prevCh">上一章</button>
      <span id="chIndicator">1 / 1</span>
      <button id="nextCh">下一章</button>
    </div>
  </div>
</div>

<script>
/* ================= 安全存储 ================= */
var Store = (function(){
  var mem = {}, ok = true;
  try { localStorage.setItem('__t__','1'); localStorage.removeItem('__t__'); }
  catch(e){ ok = false; }
  return {
    get: function(k){ return ok ? localStorage.getItem(k) : (k in mem ? mem[k] : null); },
    set: function(k,v){ if(ok){ try{localStorage.setItem(k,v);}catch(e){} } else { mem[k]=v; } },
    del: function(k){ if(ok){ try{localStorage.removeItem(k);}catch(e){} } else { delete mem[k]; } }
  };
})();

var $ = function(s){ return document.querySelector(s); };
var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };

/* ================= 封面生成 ================= */
function cover(title, emoji, c1, c2){
  var svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="'+c1+'"/><stop offset="1" stop-color="'+c2+'"/>' +
      '</linearGradient></defs>' +
      '<rect width="300" height="420" fill="url(#g)"/>' +
      '<circle cx="150" cy="168" r="90" fill="rgba(255,255,255,.10)"/>' +
      '<text x="150" y="182" font-size="84" text-anchor="middle" dominant-baseline="middle">'+emoji+'</text>' +
      '<text x="150" y="330" font-size="23" fill="#ffffff" text-anchor="middle" font-family="sans-serif">'+title+'</text>' +
    '</svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ================= 内容数据 ================= */
var MOVIES = [
  { title:'大雄兔', tag:'动画 · 高清', emoji:'🐰', c1:'#1b2a6b', c2:'#6c7bff', 
    src:'https://www.w3schools.com/html/mov_bbb.mp4',
    desc:'开源动画电影《Big Buck Bunny》片段，点击播放键即可观看。' },
    
  { title:'海底世界', tag:'风景 · 治愈', emoji:'🐠', c1:'#0f1c2e', c2:'#2c5f7c', 
    src:'https://vjs.zencdn.net/v/oceans.mp4',
    desc:'美丽的海底世界，非常治愈的风景视频。' },
    
  { title:'花朵绽放', tag:'自然 · 纪实', emoji:'🌸', c1:'#3a1b4a', c2:'#ff6b9d', 
    src:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',
    desc:'经典的自然风景测试视频，画面清晰。' },
    
  { title:'小兔快跑', tag:'动画 · 短片', emoji:'🐇', c1:'#122a3a', c2:'#4a7fa8', 
    src:'https://media.w3.org/2010/05/bunny/trailer.mp4',
    desc:'经典的动画测试片段，请点击播放键观看。' }
];

var BOOKS = [
  { title:'山海拾遗', author:'佚名', emoji:'⛰️', c1:'#1d2b4a', c2:'#3f7f8c',
    intro:'古老的传说，在某个夜晚重新醒来。',
    chapters:[
      { title:'第一章 · 石桥', text:
`雨下了整整三天。
镇口那座石桥被水漫过一半，桥面上的青苔被冲得干干净净，露出底下刻着的古怪纹路。
老人说，那纹路是很多年前留下的，没人认得，也没人敢去动它。
阿禾撑着伞站在桥头，看了很久很久。
她总觉得，那些纹路在动。` },
      { title:'第二章 · 灯', text:
`天黑以后，镇上所有的灯都亮了。
只有桥头那一盏，始终是暗的。
阿禾提着一盏旧油灯走过去，风很大，火苗却一点也不摇。
她蹲下身，把灯放在石阶上。
那一刻，桥下的水声忽然停了。` }
    ]},
  { title:'午夜咖啡馆', author:'林间', emoji:'☕', c1:'#2b1d2f', c2:'#a8567a',
    intro:'每晚十二点开门，只招待有故事的人。',
    chapters:[
      { title:'第一章 · 第一位客人', text:
`咖啡馆开在巷子最深处，招牌很旧，字迹已经看不清了。
它只在午夜十二点开门。
推门进来的第一个人，浑身湿透，手里攥着一张过期的车票。
“一杯热的，什么都行。”他说。
老板点点头，转身去磨豆子。` },
      { title:'第二章 · 车票', text:
`那张车票的日期，是十年前的今天。
“我一直没走成。”客人说，声音很轻。
老板把杯子推过去，热气在灯下散开。
“那就先坐一会儿吧，”他说，“天亮还有很久。”` }
    ]},
  { title:'代码之上', author:'阿序', emoji:'💻', c1:'#10243a', c2:'#3f8fd6',
    intro:'一个程序员的深夜独白。',
    chapters:[
      { title:'第一章 · 凌晨三点', text:
`凌晨三点，屏幕上还亮着那个红色的报错。
他揉了揉眼睛，把咖啡喝到只剩杯底。
问题一定在某个地方，只是还没被看见。
这大概是写代码最真实的样子——不是酷炫，是耐心。` }
    ]}
];

MOVIES.forEach(function(m){ m.cover = cover(m.title, m.emoji, m.c1, m.c2); });
BOOKS.forEach(function(b){ b.cover = cover(b.title, b.emoji, b.c1, b.c2); });

/* ================= 账号 ================= */
var LS_USERS = 'xw_users', LS_CUR = 'xw_cur';
var users = {};
try { users = JSON.parse(Store.get(LS_USERS) || '{}') || {}; } catch(e){ users = {}; }
var curUser = Store.get(LS_CUR) || null;
var isGuest = false;

function saveUsers(){ Store.set(LS_USERS, JSON.stringify(users)); }
function setMsg(id, txt, ok){
  var el = $('#' + id);
  el.textContent = txt;
  el.className = 'msg' + (ok ? ' ok' : '');
}

$$('.tab').forEach(function(tab){
  tab.addEventListener('click', function(){
    $$('.tab').forEach(function(t){ t.classList.remove('active'); });
    tab.classList.add('active');
    var isLogin = tab.getAttribute('data-tab') === 'login';
    $('#loginForm').classList.toggle('hidden', !isLogin);
    $('#regForm').classList.toggle('hidden', isLogin);
  });
});

$('#loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var u = $('#lu').value.trim(), p = $('#lp').value;
  if(!u || !p) return setMsg('lm','请填写用户名和密码');
  if(!users[u]) return setMsg('lm','该用户不存在，请先注册');
  if(users[u].pwd !== p) return setMsg('lm','密码错误');
  Store.set(LS_CUR, u);
  enterApp(u, false);
});

$('#regForm').addEventListener('submit', function(e){
  e.preventDefault();
  var u = $('#ru').value.trim(), p = $('#rp').value, p2 = $('#rp2').value;
  if(u.length < 2 || u.length > 12) return setMsg('rm','用户名需 2-12 个字符');
  if(p.length < 6) return setMsg('rm','密码至少 6 位');
  if(p !== p2) return setMsg('rm','两次密码不一致');
  if(users[u]) return setMsg('rm','该用户名已被占用');
  users[u] = { pwd: p };
  saveUsers();
  setMsg('rm','注册成功，正在进入…', true);
  Store.set(LS_CUR, u);
  setTimeout(function(){ enterApp(u, false); }, 400);
});

$('#guestBtn').addEventListener('click', function(){ enterApp('游客', true); });

$('#logoutBtn').addEventListener('click', function(){
  Store.del(LS_CUR);
  curUser = null; isGuest = false;
  $('#app').classList.add('hidden');
  $('#authScreen').classList.remove('hidden');
  $('#lp').value = ''; $('#lm').textContent = '';
  go('home');
});

function enterApp(name, guest){
  curUser = guest ? null : name;
  isGuest = guest;
  $('#authScreen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#who').textContent = name;
  $('#meName').textContent = name;
  $('#avatar').textContent = name.charAt(0);
  $('#meDesc').textContent = guest ? '游客模式 · 数据不保存' : '已登录 · 数据保存在本机';
  go('home');
}

/* ================= 页面切换 ================= */
function go(page){
  $$('.page').forEach(function(p){ p.classList.toggle('active', p.id === 'page-' + page); });
  $$('.nav-item').forEach(function(n){ n.classList.toggle('active', n.getAttribute('data-page') === page); });
  window.scrollTo(0, 0);
}
$$('.nav-item').forEach(function(btn){
  btn.addEventListener('click', function(){ go(btn.getAttribute('data-page')); });
});

/* ================= 渲染列表 ================= */
function cardHTML(item, idx, type){
  var sub = type === 'movie' ? item.tag : item.author;
  var badge = type === 'movie' ? '<span class="badge">▶</span>' : '';
  return '<div class="card" data-type="' + type + '" data-idx="' + idx + '">' +
           '<div class="cover"><img src="' + item.cover + '" alt="" loading="lazy">' + badge + '</div>' +
           '<div class="c-title">' + item.title + '</div>' +
           '<div class="c-sub">' + sub + '</div>' +
         '</div>';
}

$('#heroBox').innerHTML = MOVIES.slice(0,3).map(function(m, i){
  return '<div class="hero-card" data-hero="' + i + '">' +
           '<img src="' + m.cover + '" alt="">' +
           '<div class="hero-txt"><h2>' + m.title + '</h2><p>' + m.tag + '</p></div>' +
         '</div>';
}).join('');

$('#homeMovies').innerHTML = MOVIES.slice(0,4).map(function(m,i){ return cardHTML(m,i,'movie'); }).join('');
$('#movieGrid').innerHTML  = MOVIES.map(function(m,i){ return cardHTML(m,i,'movie'); }).join('');
$('#homeBooks').innerHTML  = BOOKS.slice(0,4).map(function(b,i){ return cardHTML(b,i,'book'); }).join('');
$('#bookGrid').innerHTML   = BOOKS.map(function(b,i){ return cardHTML(b,i,'book'); }).join('');

$('#heroBox').addEventListener('click', function(e){
  var c = e.target.closest('.hero-card');
  if(c) openPlayer(parseInt(c.getAttribute('data-hero'), 10));
});

document.addEventListener('click', function(e){
  var card = e.target.closest('.card');
  if(!card) return;
  var idx = parseInt(card.getAttribute('data-idx'), 10);
  if(card.getAttribute('data-type') === 'movie') openPlayer(idx);
  else openBook(idx, 0);
});

/* ================= 播放器 ================= */
var cv = $('#cv'), ctx = cv.getContext('2d');
var videoEl = $('#videoEl');
var rafId = null, playing = false, elapsed = 0, lastTs = 0, animFn = null, curMovie = 0;

var ANIMS = {
  stars: function(c, w, h, t){
    c.fillStyle = '#05060f'; c.fillRect(0,0,w,h);
    for(var i=0;i<90;i++){
      var a = i * 2.39996323;
      var p = ((t*0.16) + i/90) % 1;
      var d = p*p*Math.max(w,h)*0.85;
      var x = w/2 + Math.cos(a)*d;
      var y = h/2 + Math.sin(a)*d;
      var s = Math.max(0.6, p*2.2);
      c.fillStyle = 'rgba(200,220,255,' + p.toFixed(3) + ')';
      c.fillRect(x, y, s, s);
    }
  }
};

function playAnim(){
  if(playing || !animFn) return;
  playing = true; lastTs = 0;
  rafId = requestAnimationFrame(loop);
  $('#playBtn').textContent = '⏸ 暂停';
}
function pauseAnim(){
  if(!playing) return;
  playing = false;
  cancelAnimationFrame(rafId);
  $('#playBtn').textContent = '▶ 播放';
}
function loop(ts){
  if(!lastTs) lastTs = ts;
  elapsed += (ts - lastTs) / 1000;
  lastTs = ts;
  if(animFn) animFn(ctx, cv.clientWidth, cv.clientHeight, elapsed);
  rafId = requestAnimationFrame(loop);
}

$('#playBtn').addEventListener('click', function(){
  if(videoEl.classList.contains('hidden')){
    playing ? pauseAnim() : playAnim();
  } else {
    if(videoEl.paused) videoEl.play().catch(function(){});
    else videoEl.pause();
  }
});

function openPlayer(i){
  var m = MOVIES[i];
  if(!m) return;
  curMovie = i;
  $('#playerTitle').textContent = '正在播放';
  $('#playerName').textContent  = m.title;
  $('#playerDesc').textContent  = m.desc || '';
  $('#playHint').textContent = '手机端请手动点击 ▶ 播放';

  if(m.src){
    cv.classList.add('hidden');
    videoEl.classList.remove('hidden');
    videoEl.src = m.src;
    videoEl.play().catch(function(){});
    $('#playBtn').textContent = '⏸ 暂停';
  } else {
    videoEl.classList.add('hidden');
    cv.classList.remove('hidden');
    animFn = ANIMS.stars;
    elapsed = 0; playing = false;
    $('#playBtn').textContent = '⏸ 暂停';
  }

  $('#playerModal').classList.add('show');
  if(!m.src){ playAnim(); }
}

function closePlayer(){
  pauseAnim();
  videoEl.pause();
  videoEl.removeAttribute('src');
  try { videoEl.load(); } catch(e){}
  $('#playerModal').classList.remove('show');
}

/* ================= 阅读器 ================= */
var curBook = 0, curChapter = 0, fontSize = 17;

function openBook(bi, ci){
  curBook = bi; curChapter = ci;
  renderChapter();
  $('#readerModal').classList.add('show');
}

function renderChapter(){
  var book = BOOKS[curBook];
  var ch = book.chapters[curChapter];
  $('#readerTitle').textContent = book.title;
  $('#chIndicator').textContent = (curChapter + 1) + ' / ' + book.chapters.length;

  var html = '<h2>' + ch.title + '</h2>';
  ch.text.split('\n').forEach(function(line){
    if(line.trim()) html += '<p>' + line + '</p>';
  });

  var box = $('#readerContent');
  box.innerHTML = html;
  box.style.fontSize = fontSize + 'px';
  box.scrollTop = 0;

  $('#prevCh').disabled = (curChapter === 0);
  $('#nextCh').disabled = (curChapter === book.chapters.length - 1);
}

$('#prevCh').addEventListener('click', function(){
  if(curChapter > 0){ curChapter--; renderChapter(); }
});
$('#nextCh').addEventListener('click', function(){
  if(curChapter < BOOKS[curBook].chapters.length - 1){ curChapter++; renderChapter(); }
});
$('#fontPlus').addEventListener('click', function(){
  fontSize = Math.min(26, fontSize + 1);
  $('#readerContent').style.fontSize = fontSize + 'px';
});
$('#fontMinus').addEventListener('click', function(){
  fontSize = Math.max(13, fontSize - 1);
  $('#readerContent').style.fontSize = fontSize + 'px';
});

/* ================= 关闭弹层 ================= */
$$('[data-close]').forEach(function(btn){
  btn.addEventListener('click', function(){
    if(btn.getAttribute('data-close') === 'player') closePlayer();
    else $('#readerModal').classList.remove('show');
  });
});
$('#playerModal').addEventListener('click', function(e){
  if(e.target.id === 'playerModal') closePlayer();
});
$('#readerModal').addEventListener('click', function(e){
  if(e.target.id === 'readerModal') $('#readerModal').classList.remove('show');
});

/* ================= 启动 ================= */
(function init(){
  if(curUser && users[curUser]){
    enterApp(curUser, false);
  }
})();
</script>
