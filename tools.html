<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4f7f9">

<!-- ============ PWA 变 App 核心代码 ============ -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="万能工具箱">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3524/3524659.png">
<!-- ============================================== -->

<title>个人万能工具箱</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{--bg:#f4f7f9;--card:#ffffff;--text:#1f2937;--sub:#6b7280;--primary:#3b82f6;--border:#e5e7eb}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);
    min-height:100vh;min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }
  .hidden{display:none!important}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,textarea{font:inherit;outline:none}

  /* 顶部导航 */
  header{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));
    background:rgba(244,247,249,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  }
  .brand{font-size:18px;font-weight:700;color:var(--primary)}
  .time{font-size:13px;color:var(--sub);font-weight:500}

  .page{display:none;padding:16px 16px 90px}
  .page.active{display:block;animation:fade .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* 卡片样式 */
  .card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.03);border:1px solid rgba(0,0,0,.02)}
  .card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}

  /* 搜索 */
  .search-box{display:flex;flex-direction:column;gap:12px}
  .engines{display:flex;gap:8px;flex-wrap:wrap}
  .engine-btn{padding:6px 14px;border-radius:20px;font-size:13px;background:#f3f4f6;color:var(--sub);transition:.2s}
  .engine-btn.active{background:var(--primary);color:#fff;box-shadow:0 4px 10px rgba(59,130,246,.3)}
  .search-input-wrap{display:flex;background:#f3f4f6;border-radius:12px;padding:6px 14px}
  .search-input-wrap input{flex:1;background:none;border:none;padding:8px 0;font-size:15px}
  .search-input-wrap button{padding:8px 12px;background:var(--primary);color:#fff;border-radius:8px;font-size:14px;font-weight:500}

  /* 待办 */
  .todo-input{display:flex;gap:10px;margin-bottom:12px}
  .todo-input input{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:#f9fafb;font-size:14px}
  .todo-input button{padding:0 18px;background:var(--primary);color:#fff;border-radius:10px;font-weight:500}
  .todo-list{list-style:none}
  .todo-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);font-size:15px}
  .todo-item:last-child{border:none}
  .todo-item input[type="checkbox"]{width:20px;height:20px;accent-color:var(--primary);cursor:pointer}
  .todo-item.done span{text-decoration:line-through;color:var(--sub)}
  .todo-item .del{margin-left:auto;color:#ef4444;font-size:13px;padding:4px 8px}

  /* 密码生成 */
  .pwd-out{display:flex;background:#f3f4f6;border-radius:10px;padding:12px;margin-bottom:12px;align-items:center;justify-content:space-between}
  .pwd-out span{font-family:monospace;font-size:16px;letter-spacing:1px;word-break:break-all}
  .pwd-out button{color:var(--primary);font-size:13px;font-weight:600}
  .pwd-settings{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--sub);margin-bottom:12px}
  .pwd-settings label{display:flex;align-items:center;gap:6px}
  .pwd-gen-btn{width:100%;padding:12px;border-radius:10px;background:#e0e7ff;color:var(--primary);font-weight:600}

  /* 文本处理 */
  .text-area{width:100%;height:120px;padding:12px;border-radius:10px;border:1px solid var(--border);background:#f9fafb;font-size:14px;resize:none;margin-bottom:12px}
  .text-tools{display:flex;flex-wrap:wrap;gap:8px}
  .text-tools button{padding:8px 14px;border-radius:8px;background:#f3f4f6;font-size:13px;color:var(--text)}
  .text-stat{font-size:12px;color:var(--sub);margin-top:10px;text-align:right}

  /* 快捷导航 */
  .nav-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--text);font-size:12px}
  .nav-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.04);color:#fff}
  
  /* 底部导航 */
  .bottom-nav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;
    padding:8px 0 calc(8px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);
  }
  .nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 14px;color:var(--sub);font-size:11px;transition:.2s}
  .nav-btn .ico{font-size:20px;line-height:1}
  .nav-btn.active{color:var(--primary);font-weight:600}
</style>
</head>
<body>

<header>
  <div class="brand">🛠️ 万能工具箱</div>
  <div class="time" id="clock">加载中...</div>
</header>

<main>
  <!-- 首页：搜索 + 导航 -->
  <section id="page-home" class="page active">
    <div class="card search-box">
      <div class="engines">
        <button class="engine-btn active" data-url="https://www.baidu.com/s?wd=">百度</button>
        <button class="engine-btn" data-url="https://cn.bing.com/search?q=">Bing</button>
        <button class="engine-btn" data-url="https://www.zhihu.com/search?type=content&q=">知乎</button>
        <button class="engine-btn" data-url="https://search.bilibili.com/all?keyword=">B站</button>
      </div>
      <div class="search-input-wrap">
        <input type="text" id="searchInput" placeholder="输入要搜索的内容..." onkeypress="if(event.key==='Enter') doSearch()">
        <button onclick="doSearch()">搜索</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🚀 常用直达</div>
      <div class="nav-grid">
        <a href="https://www.taobao.com" class="nav-item" target="_blank">
          <div class="nav-icon" style="background:#ff5000">淘</div><span>淘宝</span>
        </a>
        <a href="https://www.jd.com" class="nav-item" target="_blank">
          <div class="nav-icon" style="background:#e1251b">东</div><span>京东</span>
        </a>
        <a href="https://www.bilibili.com" class="nav-item" target="_blank">
          <div class="nav-icon" style="background:#fb7299">B</div><span>B站</span>
        </a>
        <a href="https://www.zhihu.com" class="nav-item" target="_blank">
          <div class="nav-icon" style="background:#0066ff">知</div><span>知乎</span>
        </a>
        <a href="https://www.douban.com" class="nav-item" target="_blank">
          <div class="nav-icon" style="background:#007722">豆</div><span>豆瓣</span>
        </a>
        <a href="https://www.xiaohongshu.com" class="nav-item" target="_blank">
          <div class="nav-icon" style="background:#ff2442">书</div><span>小红书</span>
        </a>
        <a href="https://pan.baidu.com" class="nav-item" target="_blank">
          <div class="nav-icon" style="background:#06a7ff">盘</div><span>网盘</span>
        </a>
        <a href="https://github.com" class="nav-item" target="_blank">
          <div class="nav-icon" style="background:#24292e">G</div><span>GitHub</span>
        </a>
      </div>
    </div>
  </section>

  <!-- 工具页 -->
  <section id="page-tools" class="page">
    <!-- 待办 -->
    <div class="card">
      <div class="card-title">📝 每日待办</div>
      <div class="todo-input">
        <input type="text" id="todoText" placeholder="今天要做点什么..." onkeypress="if(event.key==='Enter') addTodo()">
        <button onclick="addTodo()">添加</button>
      </div>
      <ul class="todo-list" id="todoList"></ul>
    </div>

    <!-- 密码 -->
    <div class="card">
      <div class="card-title">🔐 随机密码生成</div>
      <div class="pwd-out">
        <span id="pwdDisplay">点击下方生成</span>
        <button onclick="copyPwd()">复制</button>
      </div>
      <div class="pwd-settings">
        <label><input type="checkbox" id="pwdUpper" checked> 大写</label>
        <label><input type="checkbox" id="pwdLower" checked> 小写</label>
        <label><input type="checkbox" id="pwdNum" checked> 数字</label>
        <label><input type="checkbox" id="pwdSym" checked> 符号</label>
      </div>
      <button class="pwd-gen-btn" onclick="genPwd()">重新生成</button>
    </div>
  </section>

  <!-- 文本页 -->
  <section id="page-text" class="page">
    <div class="card">
      <div class="card-title">✍️ 文本工具箱</div>
      <textarea class="text-area" id="textArea" placeholder="在这里输入或粘贴文本..."></textarea>
      <div class="text-tools">
        <button onclick="toCase('upper')">全大写</button>
        <button onclick="toCase('lower')">全小写</button>
        <button onclick="toCase('clear')">清空</button>
      </div>
      <div class="text-stat" id="textStat">字数: 0 | 字符: 0</div>
    </div>
  </section>
</main>

<!-- 底部导航 -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-page="home"><span class="ico">🏠</span>首页</button>
  <button class="nav-btn" data-page="tools"><span class="ico">🧰</span>工具</button>
  <button class="nav-btn" data-page="text"><span class="ico">📄</span>文本</button>
</nav>

<script>
// 动态生成 PWA manifest（将 App 的配置以代码形式注入）
const manifest = {
  name: '万能工具箱',
  short_name: '工具箱',
  start_url: './tools.html', // 确保指向当前文件
  display: 'standalone',
  background_color: '#f4f7f9',
  theme_color: '#3b82f6',
  icons: [{
    src: 'https://cdn-icons-png.flaticon.com/512/3524/3524659.png',
    sizes: '512x512',
    type: 'image/png'
  }]
};
const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
const manifestURL = URL.createObjectURL(manifestBlob);
const link = document.createElement('link');
link.rel = 'manifest';
link.href = manifestURL;
document.head.appendChild(link);

// 安全存储
var Store = (function(){
  var mem = {}, ok = true;
  try { localStorage.setItem('__t__','1'); localStorage.removeItem('__t__'); } catch(e){ ok = false; }
  return {
    get: function(k){ return ok ? localStorage.getItem(k) : (k in mem ? mem[k] : null); },
    set: function(k,v){ if(ok){ try{localStorage.setItem(k,v);}catch(e){} } else { mem[k]=v; } }
  };
})();
var $ = function(s){ return document.querySelector(s); };
var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };

// --- 时间显示 ---
function updateClock() {
  var d = new Date();
  var h = String(d.getHours()).padStart(2,'0');
  var m = String(d.getMinutes()).padStart(2,'0');
  $('#clock').textContent = h + ':' + m;
}
setInterval(updateClock, 1000); updateClock();

// --- 页面切换 ---
$$('.nav-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    $$('.nav-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    $$('.page').forEach(function(p){ p.classList.remove('active'); });
    $('#page-' + btn.dataset.page).classList.add('active');
  });
});

// --- 搜索引擎 ---
var currentEngine = "https://www.baidu.com/s?wd=";
$$('.engine-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    $$('.engine-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    currentEngine = btn.dataset.url;
  });
});
function doSearch() {
  var kw = $('#searchInput').value.trim();
  if(!kw) return;
  window.open(currentEngine + encodeURIComponent(kw), '_blank');
}

// --- 待办事项 ---
var todos = JSON.parse(Store.get('my_todos') || '[]');
function renderTodos() {
  var html = '';
  todos.forEach(function(t, i){
    html += '<li class="todo-item ' + (t.done ? 'done' : '') + '">' +
              '<input type="checkbox" ' + (t.done ? 'checked' : '') + ' onchange="toggleTodo(' + i + ')">' +
              '<span>' + t.text + '</span>' +
              '<button class="del" onclick="delTodo(' + i + ')">删除</button>' +
            '</li>';
  });
  $('#todoList').innerHTML = html || '<div style="color:#9ca3af;text-align:center;font-size:13px;padding:10px 0">暂无待办事项</div>';
}
function addTodo() {
  var txt = $('#todoText').value.trim();
  if(!txt) return;
  todos.unshift({ text: txt, done: false });
  Store.set('my_todos', JSON.stringify(todos));
  $('#todoText').value = '';
  renderTodos();
}
function toggleTodo(i) {
  todos[i].done = !todos[i].done;
  Store.set('my_todos', JSON.stringify(todos));
  renderTodos();
}
function delTodo(i) {
  todos.splice(i, 1);
  Store.set('my_todos', JSON.stringify(todos));
  renderTodos();
}
renderTodos();

// --- 密码生成 ---
function genPwd() {
  var upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  var lower = 'abcdefghijklmnopqrstuvwxyz';
  var num = '0123456789';
  var sym = '!@#$%^&*()_+~`|}{[]:;?><,./-=';
  var chars = '';
  if($('#pwdUpper').checked) chars += upper;
  if($('#pwdLower').checked) chars += lower;
  if($('#pwdNum').checked) chars += num;
  if($('#pwdSym').checked) chars += sym;
  if(!chars) { $('#pwdDisplay').textContent = '请至少勾选一项'; return; }
  
  var pwd = '';
  for(var i=0; i<16; i++) {
    pwd += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  $('#pwdDisplay').textContent = pwd;
}
function copyPwd() {
  var pwd = $('#pwdDisplay').textContent;
  if(pwd === '点击下方生成') return;
  navigator.clipboard.writeText(pwd).then(function(){
    alert('密码已复制到剪贴板！');
  }).catch(function(){
    alert('复制失败，请手动选择复制。');
  });
}

// --- 文本工具 ---
var textArea = $('#textArea');
textArea.addEventListener('input', function(){
  var val = textArea.value;
  var chars = val.length;
  var words = val.replace(/\s/g, '').length;
  $('#textStat').textContent = '字数: ' + words + ' | 字符: ' + chars;
});
function toCase(type) {
  if(type === 'upper') textArea.value = textArea.value.toUpperCase();
  if(type === 'lower') textArea.value = textArea.value.toLowerCase();
  if(type === 'clear') textArea.value = '';
  textArea.dispatchEvent(new Event('input'));
}
</script>
</body>
</html>
